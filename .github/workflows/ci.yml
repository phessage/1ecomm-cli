name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch: a newer push supersedes the run it replaces.
concurrency:
  group: 1ecomm-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Pure logic, no network. Fast enough to be the first thing that fails.
      - run: npm run test

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Hosted runners grant root, so the browser's system libraries come too.
      - run: npx playwright install --with-deps chromium

      # This suite scaffolds four real projects, installs them from the public
      # registry, builds them and drives them against the LIVE platform. It has
      # no offline mode and does not pretend to: a missing prerequisite throws
      # in global-setup rather than skipping, because a skipped suite exits zero
      # and reports green having proved nothing.
      - run: npm run test:e2e
        env:
          CI: 'true'
          # Point at a leased fixture store instead of the shared demo one by
          # setting these as repository variables.
          E2E_STORE_ID: ${{ vars.E2E_STORE_ID }}
          E2E_BOOTSTRAP_URL: ${{ vars.E2E_BOOTSTRAP_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
